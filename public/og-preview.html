<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Studio53 - Preview Image</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #111111;
      font-family: Arial, sans-serif;
      position: relative;
      overflow: hidden;
    }

    .background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, rgba(17,17,17,0.95) 0%, rgba(17,17,17,0.8) 100%);
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: white;
      padding: 2rem;
    }

    .logo {
      width: 300px;
      height: auto;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 48px;
      margin: 0 0 1rem 0;
      color: #D4AF37;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    p {
      font-size: 24px;
      margin: 0;
      color: #ffffff;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <img src="img/Barbearia 2.jpg" class="background" alt="">
  <div class="overlay"></div>
  <div class="content">
    <img src="img/Barbeariasemfundo.png" class="logo" alt="Studio53">
    <h1>Studio53</h1>
    <p>Barbearia Premium</p>
  </div>
</body>
</html>
